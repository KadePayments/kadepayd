syntax="proto3";

package kadepay.v1.services.wallet;

service WalletService {
  rpc CreateWallet(NewWalletRequest) returns (NewWalletResponse) {};

  rpc GetWalletId(WalletIdRequest) returns (WalletIdResponse) {};
}

message NewWalletRequest {
  string x_pub_key = 1;
}

message NewWalletResponse {
  string x_pub_key_id = 1;
}

message WalletIdRequest {
  string x_pub_key = 1;
}

message WalletIdResponse {
  string wallet_id = 1;
}